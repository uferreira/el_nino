# Temporary: checks whether UHSLC is reachable from a GitHub runner.
# Delete once the update_data.yml failure is understood.
name: Diag UHSLC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Runner public IP
        run: curl -sS --max-time 20 https://api.ipify.org || true

      - name: Probe URLs (default curl user agent, then Mozilla/5.0)
        run: |
          URLS=(
            "https://uhslc.soest.hawaii.edu/erddap/tabledap/global_hourly_fast.csv?sea_level,time&time>=2026-07-01T00:00:00Z&time<=2026-07-07T23:59:59Z&uhslc_id=093"
            "https://uhslc.soest.hawaii.edu/data/csv/rqds/pacific/hourly/h093a.csv"
            "https://uhslc.soest.hawaii.edu/data/csv/fast/hourly/h093.csv"
            "https://uhslc.soest.hawaii.edu/stations/RAPID/093_mm_StationZero_GMT.csv"
            "https://www.cpc.ncep.noaa.gov/data/indices/sstoi.indices"
          )
          for UA in "" "Mozilla/5.0"; do
            echo "=== user agent: ${UA:-curl default} ==="
            for U in "${URLS[@]}"; do
              echo "$U"
              if [ -z "$UA" ]; then
                curl -sS -g -o /dev/null -w "%{http_code} %{time_connect} %{time_total}\n" --max-time 60 "$U" || true
              else
                curl -sS -g -o /dev/null -w "%{http_code} %{time_connect} %{time_total}\n" --max-time 60 -A "$UA" "$U" || true
              fi
            done
          done
