name: Update ENSO data

on:
  schedule:
    # Full run — SST + all sea level stations.
    # 5th of the month, 06:00 UTC (NOAA CPC updates the SST indices around the
    # 3rd–4th, so the 5th leaves a safety buffer).
    - cron: '0 6 5 * *'
    # Sea level refresh only — skip the SST/NINO pipelines (they would just
    # re-produce identical deterministic output from the same NOAA file).
    # 18th of the month, 06:00 UTC.
    - cron: '0 6 18 * *'
  workflow_dispatch:
    inputs:
      sst_only:
        description: 'Update SST only (skip all sea level stations)'
        type: boolean
        default: false
      sl_only:
        description: 'Update sea level only (skip SST/NINO pipelines)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # The update script stops starting new downloads after ENSO_UPDATE_BUDGET_S
    # and records the rest as failed, so it finishes (and commits what it has)
    # well inside this limit even when UHSLC stalls.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e .

      - name: Make data/input directory and copy historical SST file
        # assets/data/sst1950_1981.txt is tracked in the repo;
        # pipeline.run_sst reads from data/input/ (gitignored).
        run: |
          mkdir -p data/input
          cp assets/data/sst1950_1981.txt data/input/sst1950_1981.txt

      - name: Run update script
        env:
          # Unbuffered, so the log shows how far a stalled run got.
          PYTHONUNBUFFERED: '1'
          ENSO_UPDATE_BUDGET_S: '1500'
        run: |
          FLAG=""
          # Manual dispatch inputs take precedence …
          if [ "${{ github.event.inputs.sst_only }}" = "true" ]; then
            FLAG="--sst-only"
          elif [ "${{ github.event.inputs.sl_only }}" = "true" ]; then
            FLAG="--sl-only"
          # … otherwise pick the mode from which cron schedule fired.
          # The 18th schedule is the sea-level-only refresh.
          elif [ "${{ github.event.schedule }}" = "0 6 18 * *" ]; then
            FLAG="--sl-only"
          fi
          echo "Running: python scripts/update_website.py --no-push $FLAG"
          python scripts/update_website.py --no-push $FLAG

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage every page update_website.py can patch plus the freshness
          # tracker (force-added: data/output/ is gitignored but this file must
          # persist across the ephemeral CI checkout to remember stale stations).
          git add docs
          git add -f data/output/freshness.json
          if git diff --cached --quiet; then
            echo "No changes — site data is already up to date."
          else
            # Latest month actually published, not the calendar month.
            MONTH=$(python -c "import json; s=json.load(open('data/output/freshness.json')); print(max(e['as_of'] for g in ('sst','stations') for e in s.get(g,{}).values() if e.get('as_of')))")
            git commit -m "data: update ENSO arrays through ${MONTH} [auto]"
            git push
          fi

      - name: Fail if any dataset could not be refreshed
        # The pages and freshness.json are committed above either way (a failed
        # dataset keeps its previous values and a 'fetch pending' note); this
        # step only makes the run red so the failure is not missed.
        run: |
          python - <<'EOF'
          import json, sys
          s = json.load(open("data/output/freshness.json"))
          entries = [e for g in ("sst", "stations") for e in s.get(g, {}).values()]
          latest = max((e.get("last_attempt") or "") for e in entries)
          failed = [e["name"] for e in entries
                    if e.get("last_attempt") == latest and not e.get("ok", True)]
          if failed:
              print("::error::Not refreshed this run: " + ", ".join(failed))
              sys.exit(1)
          EOF
