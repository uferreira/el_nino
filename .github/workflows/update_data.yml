name: Update ENSO data

on:
  schedule:
    # SST only. UHSLC drops connections from GitHub runner IPs, so the sea
    # level stations are refreshed from a local PC instead
    # (scripts/update_sl_local.ps1). 5th of the month, 06:00 UTC: NOAA CPC
    # updates the SST indices around the 3rd-4th.
    - cron: '0 6 5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # The update script stops starting new downloads after ENSO_UPDATE_BUDGET_S
    # and records the rest as failed, so it finishes (and commits what it has)
    # well inside this limit even when a source stalls.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e .

      - name: Run update script
        env:
          # Unbuffered, so the log shows how far a stalled run got.
          PYTHONUNBUFFERED: '1'
          ENSO_UPDATE_BUDGET_S: '1500'
        # --sst-only leaves the station entries in freshness.json untouched,
        # so they are neither marked failed nor stale by this run.
        run: python scripts/update_website.py --no-push --sst-only

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage every page update_website.py can patch plus the freshness
          # tracker (force-added: data/output/ is gitignored but this file must
          # persist across the ephemeral CI checkout to remember stale stations).
          git add docs
          git add -f data/output/freshness.json
          if git diff --cached --quiet; then
            echo "No changes — site data is already up to date."
          else
            # Latest SST month actually published, not the calendar month.
            MONTH=$(python -c "import json; s=json.load(open('data/output/freshness.json')); print(max(e['as_of'] for e in s['sst'].values() if e.get('as_of')))")
            git commit -m "data: update SST through ${MONTH} [auto]"
            git push
          fi

      - name: Fail if any dataset could not be refreshed
        # The pages and freshness.json are committed above either way (a failed
        # dataset keeps its previous values and a 'fetch pending' note); this
        # step only makes the run red so the failure is not missed.
        run: |
          python - <<'EOF'
          import json, sys
          s = json.load(open("data/output/freshness.json"))
          # SST only: the stations are not attempted here (see update_sl_local.ps1).
          entries = list(s.get("sst", {}).values())
          latest = max((e.get("last_attempt") or "") for e in entries)
          failed = [e["name"] for e in entries
                    if e.get("last_attempt") == latest and not e.get("ok", True)]
          if failed:
              print("::error::Not refreshed this run: " + ", ".join(failed))
              sys.exit(1)
          EOF
