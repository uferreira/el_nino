# Filter parameters (same as Fortran)
filter:
  HN1: 10.0   # half-period parameter: 20-month full-period pass edge
  HN2: 9.0    # half-period parameter: 18-month full-period stop edge
  NDOTS: 5    # interpolation points per month

  # ---------------------------------------------------------------------
  # Fourier analysis window (inclusive, "YYYY-MM").
  #
  # This is the ONLY place the window is configured for the Python
  # pipeline.  It is resolved by el_nino.pipeline.resolve_fourier_window()
  # and applied by el_nino.pipeline.select_fourier_window().
  # The website exposes the same window interactively; the JavaScript
  # port of this logic lives in docs/assets/js/fourier-filter.js
  # (EnsoFourier.resolveWindow / EnsoFourier.selectWindow).
  #
  #   end   : null -> the latest observation available for each dataset
  #   start : null -> base_year, in the calendar month that follows the
  #                   end month, so the window spans a whole number of
  #                   12-month seasonal cycles (e.g. an end of 2026-08
  #                   gives 1975-09, i.e. 612 months = 51 complete years).
  #
  # Each dataset is clipped to its own record: a window wider than a
  # station's record simply uses that record's own first/last month.
  # ---------------------------------------------------------------------
  window:
    start: null
    end: null
    base_year: 1975

# SST data source
sst:
  local_file: "assets/data/sst1950_1981.txt"
  ano_inicio: 1975
  noaa_url: "https://www.cpc.ncep.noaa.gov/data/indices/sstoi.indices"

# SST index definitions
sst_indices:
  - key: "nino12"
    col: 2
    anom_col: 3
    label: "NINO1+2"
  - key: "nino3"
    col: 4
    anom_col: 5
    label: "NINO3"
  - key: "nino4"
    col: 6
    anom_col: 7
    label: "NINO4"
  - key: "nino34"
    col: 8
    anom_col: 9
    label: "NINO3.4"

# Sea level stations (UHSLC)
stations:
  callao:
    id: "093"
    name: "Callao"
    start_date: "1905-01-01"
    rqd_url: "https://uhslc.soest.hawaii.edu/data/csv/rqds/pacific/hourly/h093a.csv"
    xlim: [-300, 300]
    ylim: [-60, 60]
  la_libertad:
